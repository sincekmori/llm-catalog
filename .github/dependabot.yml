# Keep GitHub Actions and Python dependencies current automatically, so versions
# don't silently fall behind. Dependabot opens weekly update PRs; CI gates them.
#
# Python updates wait until a release has been public for 7 days (`cooldown`),
# matching the `exclude-newer = "7 days"` supply-chain guard in the pyprojects.
# Security updates are exempt from the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The uv workspace (core, pydantic-ai, ai-sdk).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # The standalone llm-catalog-litellm project and its own lockfile.
  - package-ecosystem: uv
    directory: /packages/llm-catalog-litellm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-litellm:
        patterns: ["*"]
