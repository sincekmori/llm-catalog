# Keep GitHub Actions and Python dependencies current automatically, so versions
# don't silently fall behind. Dependabot opens weekly update PRs; CI gates them.
#
# Python updates wait until a release has been public for 1 day (`cooldown`),
# matching the `exclude-newer = "1 day"` supply-chain guard in pyproject.toml.
# Security updates are exempt from the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The uv workspace (core, pydantic-ai, ai-sdk, litellm) and its one lockfile.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      python:
        patterns: ["*"]
