# Automated, changeset-style releases for the four distributions.
#
# release-please reads Conventional Commits on main and opens/maintains a release
# PR per change: it bumps each affected package's version in its pyproject.toml,
# updates its CHANGELOG.md, and (when the PR is merged) tags + creates a GitHub
# Release per package (e.g. llm-catalog-core-v0.2.0). Each released package is
# then built and published to PyPI via Trusted Publishing (OIDC, no API token).
#
# This is GitHub-only (release-please + PyPI Trusted Publishing).
#
# One-time setup before the first publish:
#   - PyPI pending publishers are unique per (owner, repo, workflow, environment),
#     so each project needs a DISTINCT environment. On PyPI register a pending
#     Trusted Publisher for each (owner: sincekmori, repo: llm-catalog, workflow:
#     release.yml) with environment pypi-core / pypi-pydantic-ai / pypi-ai-sdk /
#     pypi-litellm.
#   - Create the matching GitHub Environments with those same four names.

name: Release

on:
  push:
    branches: [main]

# Never run two releases for the same branch at once, and never cancel a release
# midway (which could tag without publishing).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps each package's pyproject.toml but knows nothing about
  # uv, so the lockfiles (which record the local packages' own versions) would
  # drift on every release and sneak into someone's next unrelated commit.
  # Re-lock on the release PR branch itself so the PR ships consistent
  # metadata; CI's `uv sync --locked` guards against drift landing anywhere
  # else. Runs whenever release-please created or updated the PR, so it
  # self-heals on every push to main while the PR is open. There are two
  # lockfiles: the workspace's, and the standalone llm-catalog-litellm
  # project's (which records the core it depends on by path).
  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v7
      - run: uv lock
      - run: uv lock
        working-directory: packages/llm-catalog-litellm
      - name: Commit and push the synced lockfiles
        run: |
          locks="uv.lock packages/llm-catalog-litellm/uv.lock"
          if git diff --quiet -- $locks; then
            echo "lockfiles already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with the released package versions" -- $locks
          git push

  # One publish job per package: PyPI pending publishers are unique per
  # (owner, repo, workflow, environment), so each package needs its own
  # environment. Each job only runs when release-please released that package.
  publish-core:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, 'packages/llm-catalog-core')
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package llm-catalog-core --out-dir dist
      - run: uv publish

  publish-pydantic-ai:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, 'packages/llm-catalog-pydantic-ai')
    runs-on: ubuntu-latest
    environment: pypi-pydantic-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package llm-catalog-pydantic-ai --out-dir dist
      - run: uv publish

  publish-ai-sdk:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, 'packages/llm-catalog-ai-sdk')
    runs-on: ubuntu-latest
    environment: pypi-ai-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package llm-catalog-ai-sdk --out-dir dist
      - run: uv publish

  # llm-catalog-litellm is a standalone project, not a workspace member, so it
  # is built by path rather than with --package.
  publish-litellm:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, 'packages/llm-catalog-litellm')
    runs-on: ubuntu-latest
    environment: pypi-litellm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build packages/llm-catalog-litellm --out-dir dist
      - run: uv publish
