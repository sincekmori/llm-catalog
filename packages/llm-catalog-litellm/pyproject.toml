[project]
name = "llm-catalog-litellm"
version = "0.9.0"
description = "LiteLLM CustomLLM plugin for llm-catalog: drive a catalog config through LiteLLM, in-process or via the proxy."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shinsuke Mori" }]
keywords = ["llm", "catalog", "litellm", "gateway", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    # Pre-1.0 core treats minor bumps as breaking, so pin to the minor line the
    # adapter is developed and tested against.
    "llm-catalog-core>=0.10.0,<0.11",
    # Floor at the first LiteLLM that supports Python 3.15 and accepts
    # `openai>=3`, so this adapter shares an environment (and this repository's
    # lockfile) with the other adapters. LiteLLM is still built on httpx, so
    # this adapter uses the httpx flavour of GatewayTransport
    # (llm_catalog.core.transport).
    "litellm>=1.109.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sincekmori/llm-catalog"
Repository = "https://github.com/sincekmori/llm-catalog"
Issues = "https://github.com/sincekmori/llm-catalog/issues"
Changelog = "https://github.com/sincekmori/llm-catalog/blob/main/packages/llm-catalog-litellm/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_catalog.litellm"
namespace = true
