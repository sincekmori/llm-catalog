[project]
name = "llm-catalog-litellm"
version = "0.7.0"
description = "LiteLLM CustomLLM plugin for llm-catalog: drive a catalog config through LiteLLM, in-process or via the proxy."
readme = "README.md"
# LiteLLM itself declares `requires-python >=3.10,<3.15`; mirroring the cap
# makes an install on 3.15 fail at resolution time with a clear message.
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shinsuke Mori" }]
keywords = ["llm", "catalog", "litellm", "gateway", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Pre-1.0 core treats minor bumps as breaking, so pin to the minor line the
    # adapter is developed and tested against.
    "llm-catalog-core>=0.9.0,<0.10",
    # Floor at the verified version (also past the 1.82.7/1.82.8 supply-chain incident).
    # LiteLLM is still built on httpx and `openai<3`, so this adapter uses the
    # httpx flavour of GatewayTransport (llm_catalog.core.transport).
    "litellm>=1.90.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sincekmori/llm-catalog"
Repository = "https://github.com/sincekmori/llm-catalog"
Issues = "https://github.com/sincekmori/llm-catalog/issues"
Changelog = "https://github.com/sincekmori/llm-catalog/blob/main/packages/llm-catalog-litellm/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_catalog.litellm"
namespace = true

# --- standalone project (not a member of the repository's uv workspace) -------
# LiteLLM requires `openai<3`, which conflicts with the `openai>=3` line the
# workspace members resolve to, so this distribution has its own lockfile and
# virtual environment. Lint config is inherited from the repository root
# (ruff walks up to the nearest configured pyproject.toml).

# Dev-time resolution: use the repository's core, not the PyPI release. The
# published wheel still carries the version constraint from `dependencies`.
[tool.uv.sources]
llm-catalog-core = { path = "../llm-catalog-core", editable = true }

# Same supply-chain guard as the workspace: no release younger than 7 days.
[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ty>=0.0.73",
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "respx>=0.23",
]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
