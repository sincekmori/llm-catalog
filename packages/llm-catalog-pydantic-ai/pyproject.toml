[project]
name = "llm-catalog-pydantic-ai"
version = "0.6.0"
description = "Pydantic AI adapter for llm-catalog: build native Pydantic AI models from a catalog config, routed through your gateway."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shinsuke Mori" }]
keywords = ["llm", "catalog", "pydantic-ai", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Pre-1.0 core treats minor bumps as breaking, so pin to the minor line the
    # adapter is developed and tested against.
    # The `httpx2` extra brings the httpx2 flavour of GatewayTransport
    # (llm_catalog.core.transport2), added in core 0.9.
    "llm-catalog-core[httpx2]>=0.9.0,<0.10",
    # Floor at the verified version. Pydantic AI moved its providers from httpx
    # to httpx2 in 2.32, and the SDKs it wraps (openai>=3, anthropic>=1) reject
    # or deprecate httpx clients, so this adapter only builds httpx2 clients.
    "pydantic-ai>=2.51",
    "httpx2>=2.7",
]

[project.urls]
Homepage = "https://github.com/sincekmori/llm-catalog"
Repository = "https://github.com/sincekmori/llm-catalog"
Issues = "https://github.com/sincekmori/llm-catalog/issues"
Changelog = "https://github.com/sincekmori/llm-catalog/blob/main/packages/llm-catalog-pydantic-ai/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_catalog.pydantic_ai"
namespace = true
