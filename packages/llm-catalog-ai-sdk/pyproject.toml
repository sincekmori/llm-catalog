[project]
name = "llm-catalog-ai-sdk"
version = "0.1.0"
description = "AI SDK for Python adapter for llm-catalog: build native `ai` models from a catalog config, routed through your gateway."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shinsuke Mori" }]
keywords = ["llm", "catalog", "ai-sdk", "vercel", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Pre-1.0 core treats minor bumps as breaking, so pin to the minor line the
    # adapter is developed and tested against. The `httpx2` extra brings the
    # httpx2 flavour of GatewayTransport (llm_catalog.core.transport2).
    "llm-catalog-core[httpx2]>=0.9.0,<0.10",
    # The AI SDK for Python is in public beta and may break its API in any 0.x
    # minor, so pin to the minor line this adapter is tested against and raise
    # the range deliberately. The extras pull in the official OpenAI and
    # Anthropic SDKs, which `ai` loads lazily for its direct providers.
    "ai[anthropic,openai]>=0.7.0,<0.8",
    "httpx2>=2.12",
]

[project.urls]
Homepage = "https://github.com/sincekmori/llm-catalog"
Repository = "https://github.com/sincekmori/llm-catalog"
Issues = "https://github.com/sincekmori/llm-catalog/issues"
Changelog = "https://github.com/sincekmori/llm-catalog/blob/main/packages/llm-catalog-ai-sdk/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_catalog.ai_sdk"
namespace = true
